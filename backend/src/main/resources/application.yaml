spring:
  config:
    import:
      - optional:file:backend/.env[.properties]
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: ${WORKER_PREFETCH}
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED}

app:
  frontend-url: ${FRONTEND_URL}
  oauth2:
    frontend-callback-path: /auth/callback
    code-expiry-minutes: 5
    link-token-expiry-minutes: 5
  auth:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}
    cookie:
      name: sk_refresh
      secure: ${COOKIE_SECURE}
      same-site: Lax
      max-age-seconds: ${COOKIE_MAX_AGE}
    refresh-reuse-grace-seconds: 30
    reset-token-expiry-minutes: ${RESET_TOKEN_EXPIRY_MINUTES}
  mail:
    api-key: ${RESEND_API_KEY}
    base-url: ${RESEND_BASE_URL}
    from-name: ${MAIL_SYSTEM_FROM_NAME}
    from-email: ${MAIL_SYSTEM_FROM_EMAIL}
  webhook:
    resend:
      secret: ${RESEND_WEBHOOK_SECRET}
      tolerance-seconds: ${RESEND_WEBHOOK_TOLERANCE_SECONDS}
  outbox:
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS}
    initial-delay-ms: ${OUTBOX_INITIAL_DELAY_MS}
    batch-size: ${OUTBOX_BATCH_SIZE}
  worker:
    concurrency: ${WORKER_CONCURRENCY}
  reconciler:
    delay-ms: ${RECONCILER_DELAY_MS}
    initial-delay-ms: ${RECONCILER_INITIAL_DELAY_MS}
    stuck-after-minutes: ${RECONCILER_STUCK_AFTER_MINUTES}
