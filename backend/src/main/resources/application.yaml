spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED}

app:
  frontend-url: ${FRONTEND_URL}
  oauth2:
    frontend-callback-path: /auth/callback
    code-expiry-minutes: 5
    link-token-expiry-minutes: 5
  auth:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}
    cookie:
      name: sk_refresh
      secure: ${COOKIE_SECURE}
      same-site: Lax
      max-age-seconds: ${COOKIE_MAX_AGE}
    refresh-reuse-grace-seconds: 30
    reset-token-expiry-minutes: ${RESET_TOKEN_EXPIRY_MINUTES}
  mail:
    api-key: ${RESEND_API_KEY}
    base-url: ${RESEND_BASE_URL}
    from-name: ${MAIL_SYSTEM_FROM_NAME}
    from-email: ${MAIL_SYSTEM_FROM_EMAIL}
