spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/swiftkite}
    username: ${DATABASE_USERNAME:swiftkite}
    password: ${DATABASE_PASSWORD:local_dev_password}
    hikari:
      maximum-pool-size: 10
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:swiftkite}
    password: ${RABBITMQ_PASSWORD:local_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  oauth2:
    frontend-callback-path: /auth/callback
    code-expiry-minutes: 5
    link-token-expiry-minutes: 5
  auth:
    jwt:
      secret-key: ${JWT_SECRET_KEY:}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
    cookie:
      name: sk_refresh
      secure: ${COOKIE_SECURE:false}
      same-site: Lax
      max-age-seconds: ${COOKIE_MAX_AGE:2592000}
    refresh-reuse-grace-seconds: 30
